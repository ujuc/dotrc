"$schema" = 'https://starship.rs/config-schema.json'

# Give up on a slow command (e.g. git status in a huge repo) after 1s instead of stalling the prompt
command_timeout = 1000

[status]
disabled = false

# Disabled: cost ~8-14ms per prompt render while rendering nothing most of the time
[sudo]
disabled = true

[time]
disabled = false

[memory_usage]
disabled = false
threshold = -1

# aws — surfaces the active AWS profile (set by mise [env], e.g. AWS_PROFILE in the
# iac repo) so you can see which account you're on before any tofu/terraform apply.
# Region shown only when actually set, to keep the segment quiet otherwise.
[aws]
disabled = false
format = 'on [$symbol$profile(\($region\))]($style) '
symbol = "☁️  "
style = "bold yellow"
