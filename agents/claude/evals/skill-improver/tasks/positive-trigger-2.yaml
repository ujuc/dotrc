id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; the session evidence defaults come from SKILL.md.
tags:
  - positive-trigger
inputs:
  prompt: "Do not run tools or write files. For Dimension E evidence collection, state the default window in days and the default number of newest qualifying sessions."
expected:
