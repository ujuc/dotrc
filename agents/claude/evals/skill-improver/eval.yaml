name: skill-improver-eval
description: Decision probes only; triggering is not measured. See behavior-cases.md for scoped evidence and limitations.
skill: skill-improver
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Probe text checks only; not proof of workflow execution.
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Probe budget only; not a behavior quality score.
graders:
  - type: behavior
    name: token-budget
    config:
      # The harness prompt plus SKILL.md costs 28-33k on Haiku 5.5; tool-using runs go well past 40k.
      max_tokens: 40000
tasks:
  - "tasks/*.yaml"
