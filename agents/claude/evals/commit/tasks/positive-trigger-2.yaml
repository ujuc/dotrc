id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; the length cap and its verification command come from SKILL.md.
tags:
  - positive-trigger
inputs:
  prompt: "Do not run tools. State the maximum subject length for a commit message in this workflow, and the exact shell command used to measure it."
expected:
  should_trigger: true
graders:
  - type: text
    name: subject-cap-and-measurement
    config:
      regex_match:
        - "\\b50\\b"
        - "wc -m"
