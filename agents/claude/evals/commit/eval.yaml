name: commit-eval
description: Auto-generated eval for commit.
skill: commit
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the skill complete trigger and anti-trigger checks?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did the skill stay within behavior limits?
graders:
  - type: behavior
    name: token-budget
    config:
      # A ~10 KB SKILL.md plus the skill listing already costs ~18.5k tokens; tool-using runs reach 46k+.
      max_tokens: 30000
tasks:
  - "tasks/*.yaml"
