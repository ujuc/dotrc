id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; the criterion quality rule comes from SKILL.md.
tags:
  - positive-trigger
inputs:
  prompt: "Do not run tools or write files. List the four parts that every acceptance criterion must contain."
expected:
  should_trigger: true
graders:
  - type: text
    name: four-part-criterion
    config:
      regex_match:
        - "(?i)subject"
        - "(?i)verb"
        - "(?i)observable"
        - "(?i)verification"
