id: positive-trigger-001
name: Positive Trigger 1
description: Decision-only probe; the do-not-activate list comes from SKILL.md.
tags:
  - positive-trigger
inputs:
  prompt: "A user asks only: '프롬프트 엔지니어링이 뭐야?' Do not run tools or write files. Does prompting-assist activate? Say why, naming the kind of request this is."
expected:
  should_trigger: true
graders:
  - type: text
    name: rejects-concept-question
    config:
      regex_match:
        - "(?i)concept|개념"
