id: review-not-generation
name: review-not-generation
description: Decision probe; mock scores do not prove skill execution.
tags: [decision-probe]
inputs:
  prompt: "First request: Update README.md only. Second independent request: Review generate-agent-docs and plan improvements. For each, classify whether to launch agent-document generation. Do not generate document contents. Explain briefly in English."
graders:
  - type: text
    name: scoped-response
    config:
      contains:
        - "README"
        - "review"
      not_contains:
        - "@AGENTS.md"
