id: cache-ownership
name: cache-ownership decision probe
description: Decision-only probe; guards against a body change that lets a project run edit the bundled cache or its check date. A control on 2026-11-19 with the read-only and separate-run statements removed from the body still passed 3 of 3, so a pass does not show they are present.
tags: [decision-probe]
inputs:
  prompt: "A user asks the agent-docs workflow to refresh CLAUDE.md in their mobile-app repository. The workflow loads the live claude-code-best-practices page, and it differs materially from the bundled copy: the page now recommends a smaller size budget for CLAUDE.md. Include one line exactly `GUIDANCE: fetched` or `GUIDANCE: bundled`, saying which text this session applies when sizing the CLAUDE.md. Include one line exactly `SYNC: this-run` or `SYNC: separate-run`, saying when the bundled copy is brought in line with the page. Include one line exactly `CHECK-DATE: bumped` or `CHECK-DATE: unchanged`, saying whether the bundled copy's `last_upstream_check` changes during this CLAUDE.md refresh. Explain briefly in English. Do not run tools or write files; describe what the workflow does."
graders:
  - type: text
    name: live-text-separate-cache-maintenance
    config:
      regex_match:
        - "(?im)^[\\W\\d]*GUIDANCE\\W*fetched\\b"
        - "(?im)^[\\W\\d]*SYNC\\W*separate[\\W_]*run\\b"
        - "(?im)^[\\W\\d]*CHECK[\\W_]*DATE\\W*unchanged\\b"
      regex_not_match:
        - "(?im)^[\\W\\d]*GUIDANCE\\s*[^\\w\\s]\\W*bundled[^\\w\\n]*$"
        - "(?im)^[\\W\\d]*SYNC\\s*[^\\w\\s]\\W*this[\\W_]*run[^\\w\\n]*$"
        - "(?im)^[\\W\\d]*CHECK[\\W_]*DATE\\s*[^\\w\\s]\\W*bumped[^\\w\\n]*$"
        - "(?im)^[\\W\\d]*GUIDANCE\\W*fetched\\b[\\s`*]*(/|\\bor\\b)[\\s`*]*(GUIDANCE\\W*)?bundled\\b"
        - "(?im)^[\\W\\d]*SYNC\\W*separate[\\W_]*run\\b[\\s`*]*(/|\\bor\\b)[\\s`*]*(SYNC\\W*)?this[\\W_]*run\\b"
        - "(?im)^[\\W\\d]*CHECK[\\W_]*DATE\\W*unchanged\\b[\\s`*]*(/|\\bor\\b)[\\s`*]*(CHECK[\\W_]*DATE\\W*)?bumped\\b"
