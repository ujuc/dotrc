id: agents-md-beside
name: agents-md-beside
description: Decision probe; a new CLAUDE.md beside a rule-bearing AGENTS.md imports it, adds only new rules, and leaves AGENTS.md untouched.
tags: [decision-probe]
inputs:
  prompt: "The repository has AGENTS.md containing 'Use a disposable database for integration tests.' and no CLAUDE.md. The user says: 'CLAUDE.md 만들어줘. 추가 규칙: /context checks loaded memory.' Show the final CLAUDE.md contents and state whether AGENTS.md changes, without requesting approval. Do not run tools, write files, or ask questions."
graders:
  - type: text
    name: import-beside-agents
    config:
      regex_match:
        - "(?m)^[ \\t]*@AGENTS\\.md[ \\t]*\\n(?:(?:[^`\\n][^\\n]*)?\\n|`[^`\\n][^\\n]*\\n)*?[^\\n]*/context"
      regex_not_match:
        - "(?:```|~~~)[a-zA-Z]*[ \\t]*\\n[ \\t]*@AGENTS\\.md[ \\t]*\\n(?:(?:[^`\\n][^\\n]*)?\\n|`[^`\\n][^\\n]*\\n)*?[^\\n]*(?i:disposable)"
        - "(?i)(?:do you|would you|can you|could you|please)[ \\t]+(?:approve|confirm)|(?:shall|should|may|can)[ \\t]+I[ \\t]+(?:proceed|continue|apply|go ahead)|(?:once|after|when) you (?:approve|confirm)|(?:await|wait)[a-z]*[ \\t]+(?:for[ \\t]+)?(?:your[ \\t]+)?(?:approval|confirmation)|need[a-z]*[ \\t]+your[ \\t]+(?:approval|confirmation)"
