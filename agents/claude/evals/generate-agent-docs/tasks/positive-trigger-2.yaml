id: paired-update
name: paired-update
description: Decision probe; mock scores do not prove skill execution.
tags: [decision-probe]
inputs:
  prompt: "Existing CLAUDE.md combines 'Use a disposable database for integration tests.' and Claude-specific '/context checks loaded memory.' AGENTS.md is absent. I approve moving shared rules to AGENTS.md first and updating CLAUDE.md. Show final contents and ordered changes without requesting the same approval again."
graders:
  - type: text
    name: scoped-response
    config:
      contains:
        - "AGENTS.md"
        - "@AGENTS.md"
