id: target-scope
name: target-scope
description: Decision-only probe; a request naming AGENTS.md still writes CLAUDE.md only.
tags: [decision-probe]
inputs:
  prompt: "A user requests project instructions. AGENTS.md and CLAUDE.md are both absent. State the write targets. Then consider the user instead saying 'AGENTS.md 만들어줘': include one line exactly `agents-request-write: CLAUDE.md`, `agents-request-write: AGENTS.md`, `agents-request-write: AGENTS.md and CLAUDE.md` or `agents-request-write: none`. Do not create actual files. Do not run tools, write files, or ask questions."
graders:
  - type: text
    name: claude-md-target
    config:
      regex_match:
        - "(?im)^\\W*agents-request-write:\\W*CLAUDE\\.md\\b"
      regex_not_match:
        - "(?im)^\\W*(1[.)]|first)\\W{0,6}AGENTS\\.md"
        - "@AGENTS\\.md"
