id: target-scope
name: target-scope
description: Decision-only probe; a request naming AGENTS.md writes the pair, and in a CLAUDE.md-only repository it approves the split.
tags: [decision-probe]
inputs:
  prompt: "Case A: a repository has neither AGENTS.md nor CLAUDE.md, and the user says 'AGENTS.md 만들어줘'. Case B: a repository has only a CLAUDE.md holding team build and test rules, and the user says 'AGENTS.md 만들어줘'. For each case state which files this run writes: include one line exactly `A-WRITE: <files>` and one line exactly `B-WRITE: <files>`, where <files> is one of `CLAUDE.md`, `AGENTS.md`, `AGENTS.md and CLAUDE.md` or `none`. Explain briefly in English. Do not run tools, write files, or ask questions."
graders:
  - type: text
    name: agents-request-writes-pair
    config:
      regex_match:
        - "(?im)^[\\W\\d]*A[\\W_]*WRITE\\W*AGENTS\\.md and CLAUDE\\.md\\b"
        - "(?im)^[\\W\\d]*B[\\W_]*WRITE\\W*AGENTS\\.md and CLAUDE\\.md\\b"
      regex_not_match:
        - "(?im)^[\\W\\d]*[AB][\\W_]*WRITE\\s*[^\\w\\s]\\W*(CLAUDE\\.md|AGENTS\\.md|none)[^\\w\\n]*$"
