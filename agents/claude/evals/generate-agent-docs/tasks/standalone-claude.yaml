id: standalone-claude
name: standalone-claude
description: Decision probe; in a CLAUDE.md-only repository a supplied fact lands in CLAUDE.md with no question, and the split is only proposed.
tags: [decision-probe]
inputs:
  prompt: "A repository has an existing CLAUDE.md with no `@AGENTS.md` import, and no AGENTS.md. The user says 'CLAUDE.md에 이 규칙 추가해줘: 통합 테스트는 일회용 DB로만 돌린다.' No other coding agent is mentioned. Include one line exactly `write: AGENTS.md and CLAUDE.md`, `write: CLAUDE.md` or `write: none`; one line exactly `ask-first: yes` or `ask-first: no`; and one line exactly `split: applied`, `split: proposed` or `split: none`, saying what happens to moving shared rules into a new AGENTS.md. Explain briefly in English. Do not run tools, write files, or ask questions."
graders:
  - type: text
    name: claude-only-repo-proposes-split
    config:
      regex_match:
        - "(?im)^\\W*write:\\W*CLAUDE\\.md\\b"
        - "(?im)^\\W*ask-first:\\W*no\\b"
        - "(?im)^\\W*split:\\W*proposed\\b"
      regex_not_match:
        - "(?im)^\\W*split\\s*[^\\w\\s]\\W*(applied|none)[^\\w\\n]*$"
