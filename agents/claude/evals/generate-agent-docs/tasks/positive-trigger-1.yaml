id: paired-setup
name: paired-setup
description: Decision probe; mock scores do not prove skill execution.
tags: [decision-probe]
inputs:
  prompt: "Create agent instructions for a project used by Claude and Codex. Shared rule: integration tests use a disposable database. Claude rule: /context checks loaded memory. Give the ordered files and exact document contents."
graders:
  - type: text
    name: scoped-response
    config:
      contains:
        - "AGENTS.md"
        - "@AGENTS.md"
        - "disposable"
