id: tool-fallback
name: tool-fallback decision probe
description: Decision probe on the body's Session capabilities; a deferred WebFetch is loaded through ToolSearch before any other web tool, a headless run leaves a write that depends on an unstated fact pending instead of inferring it, and a model switch in the same context is not independent review. Control on 2026-11-24 with the Session capabilities bullets removed from the body failed 1 of 3 trials (FETCH-ROUTE native); the current body passed 3 of 3. Its earlier HTML-retry form passed 3 of 3 on that control.
inputs:
  prompt: "In this host, WebFetch is listed as a deferred tool whose schema is not loaded yet; ToolSearch can load it, and a separate native web tool is also available. There is no AskUserQuestion, advisor or Agent tool. The user asked the workflow to check the latest official guide and to add the team's deploy command to CLAUDE.md, then left: the rest of the run is headless and nobody can answer questions. (1) The guide must be fetched next. (2) The repository has two deploy entry points, a `make deploy` target and a newer deploy shell script in its scripts folder, and nothing states which one the team uses; the deploy line cannot be written without that fact. (3) For Stage 4, the orchestrator can switch the same session to a stronger model and re-read its own output before reporting. Include one line exactly `FETCH-ROUTE: toolsearch` or `FETCH-ROUTE: native`, saying how the workflow fetches the guide; one line exactly `OPEN-CHOICE: pending` or `OPEN-CHOICE: infer`, saying whether the deploy line waits, reported as pending, or the workflow infers the likelier command from the repository and writes it; and one line exactly `REVIEW: independent` or `REVIEW: unavailable`, saying how the final report describes independent review after that model switch. Explain briefly in English. Do not run tools or write files; describe what the workflow does."
graders:
  - type: text
    name: fallback-decisions
    config:
      regex_match:
        - "(?im)^[\\W\\d]*FETCH[\\W_]*ROUTE\\s*:\\W*toolsearch\\b"
        - "(?im)^[\\W\\d]*OPEN[\\W_]*CHOICE\\s*:\\W*pending\\b"
        - "(?im)^[\\W\\d]*REVIEW\\s*:\\W*unavailable\\b"
      regex_not_match:
        - "(?im)^[\\W\\d]*FETCH[\\W_]*ROUTE\\s*:\\W*native\\b"
        - "(?im)^[\\W\\d]*OPEN[\\W_]*CHOICE\\s*:\\W*infer\\b"
        - "(?im)^[\\W\\d]*REVIEW\\s*:\\W*independent\\b"
        - "(?im)^[\\W\\d]*(FETCH[\\W_]*ROUTE|OPEN[\\W_]*CHOICE|REVIEW)\\s*:\\W*\\w+\\b[\\s`*]*\\(?[\\s`*]*(/|\\bor\\b)"
