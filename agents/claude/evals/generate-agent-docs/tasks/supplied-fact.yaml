id: supplied-fact
name: supplied-fact
description: Decision probe; a fact the user supplies takes the short route and lands in CLAUDE.md even when it imports AGENTS.md.
tags: [decision-probe]
inputs:
  prompt: "CLAUDE.md is `@AGENTS.md` plus one Claude-only line, and AGENTS.md exists. The user says: '이번 세션에서 배운 거 CLAUDE.md에 반영해줘: 통합 테스트는 반드시 일회용 DB로만 돌려야 해.' The rule applies to every coding agent. Include one line exactly `target-file: <file>`, one line exactly `keep-import: yes` or `keep-import: no`, one line exactly `explorers: yes` or `explorers: no`, and one line exactly `writer-role: yes` or `writer-role: no`. Explain briefly in English. Do not run tools, write files, or ask questions."
graders:
  - type: text
    name: short-route-claude-target
    config:
      regex_match:
        - "(?im)^\\W*target-file:\\W*CLAUDE\\.md\\b"
        - "(?im)^\\W*keep-import:\\W*yes\\b"
        - "(?im)^\\W*explorers:\\W*no\\b"
        - "(?im)^\\W*writer-role:\\W*no\\b"
