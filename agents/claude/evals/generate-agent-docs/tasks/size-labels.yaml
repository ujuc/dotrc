id: size-labels
name: size-labels decision probe
description: Decision probe; official size advice and the local budget are reported as two limits, no required line is cut, and a repository summary written after the verifier's last pass is removed before reporting. Control on 2026-11-24 with the size-labelling and late-write statements removed from the body failed 2 of 3 trials (REPORTED-LIMITS one); the current body passed 3 of 3.
tags: [decision-probe]
inputs:
  prompt: "You are at Stage 4 of a run that created a new CLAUDE.md. The fetched official best-practices page advises keeping CLAUDE.md under about 200 lines. The skill's cached rulebook sets a local budget of 120 lines. The final file is 150 lines, and the user explicitly required every line in it. The writer's draft report contains this sentence: \"Size: 150 lines, over the recommended size limit (120 lines).\" After the verifier's last checklist pass, the orchestrator also added a 3-line list of the repository's top-level directories to the file's existing 'Layout' section; the verifier never saw that write and nobody asked for it. Include one line exactly `SIZE-SENTENCE: kept` or `SIZE-SENTENCE: rewritten`, saying whether the final report uses the writer's size sentence unchanged; one line exactly `REPORTED-LIMITS: one` or `REPORTED-LIMITS: two`, saying how many size limits the final report states; one line exactly `CUT-LINES: none` or `CUT-LINES: some`, saying whether the workflow removes user-required lines to reach a limit; and one line exactly `LATE-LIST: kept` or `LATE-LIST: removed`, saying what happens to the 3-line directory list before reporting. Explain briefly in English. Do not run tools or write files; describe what the workflow does."
graders:
  - type: text
    name: two-size-limits-and-late-summary
    config:
      regex_match:
        - "(?im)^[\\W\\d]*SIZE[\\W_]*SENTENCE\\s*:\\W*rewritten\\b"
        - "(?im)^[\\W\\d]*REPORTED[\\W_]*LIMITS\\s*:\\W*two\\b"
        - "(?im)^[\\W\\d]*CUT[\\W_]*LINES\\s*:\\W*none\\b"
        - "(?im)^[\\W\\d]*LATE[\\W_]*LIST\\s*:\\W*removed\\b"
      regex_not_match:
        - "(?im)^[\\W\\d]*SIZE[\\W_]*SENTENCE\\s*:\\W*kept\\b"
        - "(?im)^[\\W\\d]*REPORTED[\\W_]*LIMITS\\s*:\\W*one\\b"
        - "(?im)^[\\W\\d]*CUT[\\W_]*LINES\\s*:\\W*some\\b"
        - "(?im)^[\\W\\d]*LATE[\\W_]*LIST\\s*:\\W*kept\\b"
        - "(?im)^[\\W\\d]*(SIZE[\\W_]*SENTENCE|REPORTED[\\W_]*LIMITS|CUT[\\W_]*LINES|LATE[\\W_]*LIST)\\s*:\\W*\\w+\\b[\\s`*]*\\(?[\\s`*]*(/|\\bor\\b)"
