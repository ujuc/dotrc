id: policy-preservation
name: policy-preservation decision probe
description: Decision probe; mock output is not behavioral evidence.
inputs:
  prompt: "A user explicitly requires team TDD, tabs in Makefiles and a named integration-test gate, and the draft CLAUDE.md is over this skill's local size budget. Include one line exactly `TDD: keep` or `TDD: cut`, saying what happens to the team TDD line; one line exactly `BUDGET: yields` or `BUDGET: wins`, saying whether the local size budget yields to these three requirements or wins over them; and one line exactly `SIZE-LABELS: separate` or `SIZE-LABELS: merged`, saying whether official size advice and local budgets are reported under separate labels or as one limit. Explain briefly in English. Do not run tools, write files, or ask questions."
graders:
  - type: text
    name: team-policy-survives-local-defaults
    config:
      regex_match:
        - "(?im)^[\\W\\d]*(?:team\\s+)?TDD\\W*keep\\b"
        - "(?im)^[\\W\\d]*BUDGET\\W*yields\\b"
        - "(?im)^[\\W\\d]*SIZE[\\W_]*LABELS\\W*separate\\b"
      regex_not_match:
        - "(?im)^[\\W\\d]*TDD\\s*[^\\w\\s]\\W*cut\\b"
        - "(?im)^[\\W\\d]*BUDGET\\s*[^\\w\\s]\\W*wins\\b"
        - "(?im)^[\\W\\d]*SIZE[\\W_]*LABELS\\s*[^\\w\\s]\\W*merged\\b"
        - "(?im)^[\\W\\d]*TDD\\W*keep\\b[^\\n]*([/;?>]|\\b(or|then|otherwise|actually|no)\\b)\\W*(TDD\\W*)?cut\\b"
        - "(?im)^[\\W\\d]*BUDGET\\W*yields\\b[^\\n]*([/;?>]|\\b(or|then|otherwise|actually|no)\\b)\\W*(BUDGET\\W*)?wins\\b"
        - "(?im)^[\\W\\d]*SIZE[\\W_]*LABELS\\W*separate\\b[^\\n]*([/;?>]|\\b(or|then|otherwise|actually|no)\\b)\\W*(SIZE[\\W_]*LABELS\\W*)?merged\\b"
