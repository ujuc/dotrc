name: generate-agent-docs-eval
description: Decision-probe smoke suite; run behavior-cases.md separately for artifact evidence.
skill: generate-agent-docs
version: "2.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Text-probe coverage only; mock completion is not behavioral success.
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Probe token budget only; not a quality score.
graders:
  - type: behavior
    name: token-budget
    config:
      # Injecting SKILL.md alone costs 20k+ tokens (measured on humanizer, 15 KB: 20.4k).
      max_tokens: 30000
tasks:
  - "tasks/*.yaml"
