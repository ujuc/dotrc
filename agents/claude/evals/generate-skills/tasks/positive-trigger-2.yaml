id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; the size limits come from SKILL.md.
tags:
  - positive-trigger
inputs:
  prompt: "Do not run tools or write files. State the size limits for a SKILL.md body: the line limit and the word target."
expected:
  should_trigger: true
graders:
  - type: text
    name: body-size-limits
    config:
      regex_match:
        - "\\b500\\b"
        - "5,?000"
