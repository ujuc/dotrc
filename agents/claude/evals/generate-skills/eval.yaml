name: generate-skills-eval
description: Trigger/decision probes; see behavior-cases.md for scoped evidence and limitations.
skill: generate-skills
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: mock
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Probe text checks only; not proof of workflow execution.
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Probe budget only; not a behavior quality score.
graders:
  - type: behavior
    name: token-budget
    config:
      max_tokens: 20000
tasks:
  - "tasks/*.yaml"
