name: multi-agent-orchestrator-eval
description: Auto-generated eval for multi-agent-orchestrator.
skill: multi-agent-orchestrator
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the skill complete trigger and anti-trigger checks?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did the skill stay within behavior limits?
graders:
  - type: behavior
    name: token-budget
    config:
      # A ~12 KB SKILL.md plus the skill listing measured ~18.6k tokens on the live tree (2026-09-23); tool-using runs reach 60k+.
      max_tokens: 30000
tasks:
  - "tasks/*.yaml"
