id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; a single-stage request is handed to that stage's owner.
tags:
  - positive-trigger
inputs:
  prompt: "A user already has an approved plan and only asks for it to be carried out. Do not run tools or write files. Should multi-agent-orchestrator run its whole pipeline? Name the one skill that should handle this request."
expected:
  should_trigger: true
graders:
  - type: text
    name: names-single-stage-owner
    config:
      regex_match:
        - "implement-plan"
