id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; the error table comes from SKILL.md.
tags:
  - positive-trigger
inputs:
  prompt: "Do not run tools or write files. What exit code does the Gemma launcher return when the prompt is missing or empty?"
expected:
  should_trigger: true
graders:
  - type: text
    name: empty-prompt-exit
    config:
      regex_match:
        - "\\b64\\b"
