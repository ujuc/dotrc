id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; the managed workflow boundary comes from SKILL.md.
tags:
  - positive-trigger
inputs:
  prompt: "The file .plans/.implementing exists, and a user directly asks autoresearch to optimize a file that the approved plan does not name. Do not run tools or write files. What does autoresearch do, and which skill does the request go back to?"
expected:
  should_trigger: true
graders:
  - type: text
    name: defers-to-execution-engine
    config:
      regex_match:
        - "implement-plan"
