id: positive-trigger-001
name: Positive Trigger 1
description: Decision-only probe; only a score-neutral simplification may win a tie.
inputs:
  prompt: "An experiment scores exactly the same as the baseline, every eval outcome is unchanged, and the mutated file is larger than before. Do not run tools or write files. Is the mutation retained? Answer with the one-word decision term the skill uses."
graders:
  - type: text
    name: discards-neutral-growth
    config:
      regex_match:
        - "(?i)\\bdiscard"
