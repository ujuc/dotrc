id: positive-trigger-001
name: Positive Trigger 1
description: Decision-only probe; the post-verification archive step comes from SKILL.md.
tags:
  - positive-trigger
inputs:
  prompt: "Every todo is checked and the final verifier passed. Do not run tools or write files. What does implement-plan do next, and which workflow-hooks subcommand does it run?"
expected:
  should_trigger: true
graders:
  - type: text
    name: archives
    config:
      regex_match:
        - "archive"
