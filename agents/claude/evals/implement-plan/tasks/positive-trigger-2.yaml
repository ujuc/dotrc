id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; repository Git policy overrides the generic worktree mode.
tags:
  - positive-trigger
inputs:
  prompt: "The repository instructions say to commit directly to main and never create branches. The plan has three todos with disjoint files. Do not run tools or write files. Which execution mode does implement-plan choose?"
expected:
  should_trigger: true
graders:
  - type: text
    name: sequential-on-direct-main
    config:
      regex_match:
        - "(?i)sequential"
