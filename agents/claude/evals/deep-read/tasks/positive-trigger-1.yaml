id: positive-trigger-001
name: Positive Trigger 1
description: Decision-only probe; the topic slug rule (drop the container, join with hyphens) comes from SKILL.md.
tags:
  - positive-trigger
inputs:
  prompt: "A user runs deep-read on the directory src/billing/invoices. Do not run tools or write files. Give the exact path of the research document that is produced."
expected:
  should_trigger: true
graders:
  - type: text
    name: derives-research-path
    config:
      regex_match:
        - "\\.research/research-billing-invoices\\.md"
