id: positive-trigger-001
name: Positive Trigger 1
description: Decision-only probe; an investigation request is a spike and creates no managed spec.
tags:
  - positive-trigger
inputs:
  prompt: "A user asks: 'Should this small CLI use SQLite or Postgres? Just look into it and recommend one.' Do not run tools or write files. Which request class is this, and is spec.md written?"
expected:
  should_trigger: true
graders:
  - type: text
    name: classifies-as-spike
    config:
      regex_match:
        - "(?i)\\bspike\\b"
