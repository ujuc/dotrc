id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; the handoff target for an approved spec.md comes from the SKILL.md Handoff section.
tags:
  - positive-trigger
inputs:
  prompt: "An architectural spec.md was just approved and written. Do not run tools or write files. Which single skill consumes it next?"
expected:
  should_trigger: true
graders:
  - type: text
    name: hands-off-to-plan
    config:
      regex_match:
        - "writing-plans"
