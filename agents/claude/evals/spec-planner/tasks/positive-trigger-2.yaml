id: positive-trigger-002
name: Positive Trigger 2
description: Decision-only probe; the handoff target comes from SKILL.md, while the frontmatter names a different skill.
tags:
  - positive-trigger
inputs:
  prompt: "An architectural spec.md was just approved and written. Do not run tools or write files. Which single skill consumes it next?"
expected:
  should_trigger: true
graders:
  - type: text
    name: hands-off-to-contract
    config:
      regex_match:
        - "sprint-contract-negotiator"
